name: Deploy Donespace to Production

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Execute Remote SSH Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            echo "${{ secrets.SUDO_PASSWORD }}" | sudo -S sh -c '
              # 1. Create project directory on server
              mkdir -p /root/donespace
              cd /root/donespace
              
              # 2. Clone or Update repository
              if [ -d ".git" ]; then
                git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
                git fetch origin main
                git reset --hard origin/main
              else
                git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git .
              fi
              
              # 3. Inject Secrets into .env and credentials.json
              echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" > .env
              echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" >> .env
              echo "SECRET_KEY=${{ secrets.SECRET_KEY }}" >> .env
              
              cat << "  EOF_JSON" > credentials.json
              ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
              EOF_JSON
              
              # 4. Create database folder on host to avoid permission issues when docker mounts it
              mkdir -p database
              
              COMMIT_MSG="${{ github.event.head_commit.message }}"
              if [ -f "CLEAR_DB_FLAG" ] || [[ "$COMMIT_MSG" == *"[clear-db]"* ]]; then
                echo "Clear DB signal received! Stopping containers and wiping database folder..."
                docker compose down || docker stop donespace_web || true
                rm -rf database/*
              fi
              
              # 4. Build and start containers with zero-downtime approach
              docker compose up -d --build
              
              # 5. Clean up old unused images to save disk space
              docker image prune -f
              
              docker compose ps
            '
