{% extends "base.html" %}

{% block title %}Activity Log — DoneSpace{% endblock %}

{% block head %}
    <style>
        .timeline-container {
            max-width: 700px;
            margin: 40px auto;
            padding: 20px;
        }
        
        .timeline {
            position: relative;
            padding-left: 30px;
        }
        
        /* Clean minimalist timeline line */
        .timeline::before {
            content: '';
            position: absolute;
            left: 11px;
            top: 20px;
            bottom: 0;
            width: 2px;
            background: #e2e8f0;
            border-radius: 2px;
        }
        
        @media (max-width: 768px) {
            .timeline-container {
                padding: 10px;
                margin: 20px auto;
            }
            .timeline {
                padding-left: 20px;
            }
            .timeline::before {
                left: 6px;
            }
        }
        
        .timeline-item {
            position: relative;
            margin-bottom: 32px;
            animation: fadeUp 0.4s ease-out forwards;
            opacity: 0;
            transform: translateY(10px);
        }
        
        /* Minimalist timeline node */
        .timeline-node {
            position: absolute;
            left: -24px;
            top: 10px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--surface-color);
            border: 2px solid var(--primary-light);
            z-index: 2;
        }
        
        /* Node Colors based on context */
        .node-create { border-color: #20c997; }
        .node-edit { border-color: var(--primary-light); }
        .node-delete { border-color: #ff6b6b; }
        
        @media (max-width: 768px) {
            .timeline-node {
                left: -19px;
                width: 10px;
                height: 10px;
                top: 8px;
            }
            .timeline-item {
                margin-bottom: 24px;
            }
        }
        
        .timeline-content {
            background: var(--surface-color);
            border: 1px solid rgba(0, 0, 0, 0.04);
            border-radius: var(--border-radius-md);
            box-shadow: var(--shadow-soft);
            padding: 16px 20px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .timeline-content:hover {
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.08);
            transform: translateY(-2px);
        }

        .timeline-header {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .timeline-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid rgba(0,0,0,0.05);
        }
        .timeline-meta {
            display: flex;
            flex-direction: column;
            gap: 2px;
            flex: 1;
        }
        
        /* Inline sentence structure for the action */
        .timeline-action-sentence {
            color: var(--text-main);
            font-size: 0.95rem;
            line-height: 1.4;
        }
        .timeline-user {
            font-weight: 600;
            color: var(--text-main);
        }
        .timeline-action-text {
            color: var(--text-muted);
        }
        .action-highlight {
            font-weight: 600;
            color: var(--text-main);
        }
        
        .timeline-time {
            font-size: 0.8rem;
            color: #adb5bd;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        /* Modern Diff UI */
        .diff-container {
            margin-top: 14px;
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: var(--border-radius-sm);
            padding: 12px 16px;
        }
        
        .diff-row {
            display: flex;
            align-items: baseline;
            gap: 12px;
            padding: 6px 0;
            border-bottom: 1px dashed #dee2e6;
            font-size: 0.9rem;
        }
        .diff-row:last-child {
            border-bottom: none;
        }
        
        @media (max-width: 500px) {
            .diff-row {
                flex-direction: column;
                gap: 6px;
            }
        }
        
        .diff-key {
            color: var(--text-main);
            font-weight: 600;
            min-width: 100px;
        }
        .diff-values {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        
        .diff-badge {
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.85rem;
            word-break: break-word;
            border: 1px solid transparent;
            font-weight: 500;
        }
        .diff-badge.old {
            background: #fff5f5;
            color: #e03131;
            border-color: #ffc9c9;
            text-decoration: line-through;
        }
        .diff-badge.new {
            background: #ebfbee;
            color: #2b8a3e;
            border-color: #b2f2bb;
        }
        .diff-arrow {
            color: #ced4da;
            font-size: 18px;
            margin: 0 4px;
        }
        
        /* Premium Empty State */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            text-align: center;
            background: var(--surface-color);
            border: 1px dashed #ced4da;
            border-radius: 24px;
            margin-top: 40px;
            animation: fadeUp 0.6s ease-out forwards;
        }
        .empty-icon {
            font-size: 64px;
            color: #dee2e6;
            margin-bottom: 16px;
        }
        .empty-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 8px;
        }
        .empty-subtitle {
            color: var(--text-muted);
            font-size: 1.05rem;
            max-width: 400px;
            line-height: 1.5;
        }
        
        .loading-indicator {
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid #dee2e6;
            border-top-color: var(--primary-purple);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes fadeUp {
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
{% endblock %}

{% block content %}
<div class="timeline-container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; flex-wrap: wrap; gap: 16px;">
        <h1 style="margin: 0; font-weight: 700; color: var(--text-main); letter-spacing: -0.5px;">Activity Log</h1>
        <div class="search-box" style="position: relative; width: 100%; max-width: 300px;">
            <span class="material-symbols-rounded" style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #9ca3af; font-size: 20px;">search</span>
            <input type="text" id="logSearchInput" placeholder="Search activities..." style="font-family: inherit; width: 100%; padding: 10px 16px 10px 42px; border-radius: 20px; border: 1px solid var(--border-color); background: var(--surface-color); outline: none; transition: box-shadow 0.2s, border-color 0.2s; font-size: 14px; color: var(--text-main); box-sizing: border-box;">
        </div>
    </div>
    <div id="timelineContainer">
        <!-- Content gets appended here -->
    </div>
    
    <div id="loadingIndicator" class="loading-indicator">
        <div class="spinner"></div> <span>Loading activities...</span>
    </div>
    <div id="endOfLogs" class="loading-indicator" style="display: none;">
        <span class="material-symbols-rounded" style="color: #adb5bd;">check_circle</span> <span>You've reached the end!</span>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const container = document.getElementById('timelineContainer');
        const loadingIndicator = document.getElementById('loadingIndicator');
        const endOfLogs = document.getElementById('endOfLogs');
        
        let currentPage = 1;
        const limit = 20;
        let isLoading = false;
        let hasMore = true;
        let searchQuery = '';
        let searchTimeout;
        
        const searchInput = document.getElementById('logSearchInput');
        if (searchInput) {
            searchInput.addEventListener('input', (e) => {
                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(() => {
                    searchQuery = e.target.value.trim();
                    currentPage = 1;
                    hasMore = true;
                    container.innerHTML = ''; // Clear existing logs
                    fetchLogs();
                }, 400);
            });
        }
        
        const actionMap = {
            'completed_task': { text: 'completed the task', type: 'create' },
            'uncompleted_task': { text: 'unmarked the task', type: 'delete' },
            'added_task': { text: 'added a new task', type: 'create' },
            'edited_task': { text: 'edited the task', type: 'edit' },
            'deleted_task': { text: 'deleted the task', type: 'delete' },
            'updated_meals': { text: 'updated the meal plan', type: 'edit' },
            'updated_recipes': { text: 'updated the recipe bank', type: 'edit' }
        };
        
        // Helper: Convert timestamp to relative time (e.g. "2 hours ago")
        function getRelativeTime(timestamp) {
            const rtf = new Intl.RelativeTimeFormat('en', { numeric: 'auto' });
            const daysDifference = Math.round((new Date(timestamp) - new Date()) / (1000 * 60 * 60 * 24));
            const hoursDifference = Math.round((new Date(timestamp) - new Date()) / (1000 * 60 * 60));
            const minutesDifference = Math.round((new Date(timestamp) - new Date()) / (1000 * 60));
            
            if (Math.abs(minutesDifference) < 1) return 'Just now';
            if (Math.abs(minutesDifference) < 60) return rtf.format(minutesDifference, 'minute');
            if (Math.abs(hoursDifference) < 24) return rtf.format(hoursDifference, 'hour');
            return rtf.format(daysDifference, 'day');
        }

        async function fetchLogs() {
            if (isLoading || !hasMore) return;
            isLoading = true;
            loadingIndicator.style.display = 'flex';
            
            try {
                const searchParam = searchQuery ? `&q=${encodeURIComponent(searchQuery)}` : '';
                const res = await window.HomeAPI.fetch(`/logs?page=${currentPage}&limit=${limit}${searchParam}`);
                if (!res.ok) throw new Error('Failed to fetch logs');
                
                const data = await res.json();
                const logs = data.logs || [];
                
                loadingIndicator.style.display = 'none';
                
                if (logs.length === 0 && currentPage === 1) {
                    if (searchQuery) {
                        container.innerHTML = `
                            <div class="empty-state">
                                <span class="material-symbols-rounded empty-icon">search_off</span>
                                <h2 class="empty-title">No Results Found</h2>
                                <p class="empty-subtitle">We couldn't find any activities matching "${searchQuery}".</p>
                            </div>
                        `;
                    } else {
                        container.innerHTML = `
                            <div class="empty-state">
                                <span class="material-symbols-rounded empty-icon">history_toggle_off</span>
                                <h2 class="empty-title">A Quiet Home</h2>
                                <p class="empty-subtitle">No activities have been recorded yet. When someone completes a chore, adds a task, or makes a change, it will appear here.</p>
                            </div>
                        `;
                    }
                    hasMore = false;
                    return;
                }
                
                if (currentPage === 1) {
                    container.className = 'timeline';
                }
                
                logs.forEach((log, index) => {
                    const actionInfo = actionMap[log.action] || { text: 'modified', type: 'edit' };
                    const relativeTime = getRelativeTime(log.timestamp);
                    const exactTime = new Date(log.timestamp).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
                    
                    const div = document.createElement('div');
                    div.className = 'timeline-item';
                    
                    const avatarSrc = log.user_avatar || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(log.user_name) + '&background=random';
                    
                    let nodeClass = '';
                    if (actionInfo.type === 'create') nodeClass = 'node-create';
                    if (actionInfo.type === 'edit') nodeClass = 'node-edit';
                    if (actionInfo.type === 'delete') nodeClass = 'node-delete';
                    
                    let diffHtml = '';
                    if (log.payload && log.payload.changes) {
                        diffHtml = '<div class="diff-container">';
                        for (const [key, change] of Object.entries(log.payload.changes)) {
                            const readableKey = key.charAt(0).toUpperCase() + key.slice(1).replace(/_/g, ' ');
                            
                            diffHtml += '<div class="diff-row">';
                            diffHtml += `<div class="diff-key">${readableKey}</div>`;
                            diffHtml += `<div class="diff-values">`;
                            
                            if (change.old !== undefined && change.old !== null) {
                                diffHtml += `<span class="diff-badge old">${change.old}</span>`;
                            }
                            
                            if (change.old !== undefined && change.old !== null && change.new !== undefined && change.new !== null) {
                                diffHtml += `<span class="material-symbols-rounded diff-arrow">arrow_right_alt</span>`;
                            }
                            
                            if (change.new !== undefined && change.new !== null) {
                                diffHtml += `<span class="diff-badge new">${change.new}</span>`;
                            } else if (change.old !== undefined) {
                                diffHtml += `<span class="diff-badge old" style="text-decoration:none; background: transparent; border-color: transparent; color: var(--text-muted);">(Removed)</span>`;
                            }
                            
                            diffHtml += '</div></div>';
                        }
                        diffHtml += '</div>';
                    }
                    
                    div.innerHTML = `
                        <div class="timeline-node ${nodeClass}"></div>
                        <div class="timeline-content">
                            <div class="timeline-header">
                                <img src="${avatarSrc}" class="timeline-avatar" alt="Avatar">
                                <div class="timeline-meta">
                                    <div class="timeline-action-sentence">
                                        <span class="timeline-user">${log.user_name}</span> 
                                        <span class="timeline-action-text">${actionInfo.text}</span> 
                                        <span class="action-highlight">${log.details}</span>
                                    </div>
                                    <span class="timeline-time" title="${exactTime}">
                                        <span class="material-symbols-rounded" style="font-size: 14px;">schedule</span> 
                                        ${relativeTime}
                                    </span>
                                </div>
                            </div>
                            ${diffHtml}
                        </div>
                    `;
                    container.appendChild(div);
                });
                
                hasMore = data.has_next;
                if (!hasMore && currentPage > 1) {
                    endOfLogs.style.display = 'flex';
                }
                currentPage++;
                
            } catch (err) {
                loadingIndicator.style.display = 'none';
                container.innerHTML += '<p style="color: #ff6b6b; padding: 20px;">Error loading activity logs.</p>';
            } finally {
                isLoading = false;
            }
        }

        // Infinite Scroll Observer
        const observer = new IntersectionObserver((entries) => {
            if (entries[0].isIntersecting && hasMore && !isLoading) {
                fetchLogs();
            }
        }, { rootMargin: "100px" });
        
        observer.observe(loadingIndicator);
        
        // Initial fetch
        fetchLogs();
    });
</script>
{% endblock %}
