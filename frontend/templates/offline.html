<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DoneSpace — You're Offline</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/static/css/main.css?v=14">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f0c20 0%, #17122b 50%, #201435 100%);
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
            color: #f3effc;
            text-align: center;
            box-sizing: border-box;
            padding: 24px;
        }
        .offline-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 28px;
            padding: 48px 32px;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            animation: fadeIn 0.6s ease;
        }
        .icon-wrapper {
            width: 88px;
            height: 88px;
            border-radius: 24px;
            background: linear-gradient(135deg, rgba(140, 82, 255, 0.2), rgba(107, 40, 217, 0.4));
            border: 1px solid rgba(140, 82, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
        }
        .icon-wrapper .material-symbols-rounded {
            font-size: 44px;
            color: #b388ff;
        }
        h1 {
            font-size: 26px;
            font-weight: 700;
            margin: 0 0 12px;
            letter-spacing: -0.5px;
        }
        p {
            font-size: 15px;
            color: #a49bb5;
            line-height: 1.6;
            margin: 0 0 32px;
        }
        .retry-btn {
            background: linear-gradient(135deg, #8c52ff, #6b28d9);
            color: #ffffff;
            border: none;
            padding: 14px 32px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 16px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 8px 24px rgba(140, 82, 255, 0.35);
            transition: all 0.2s ease;
            font-family: inherit;
        }
        .retry-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(140, 82, 255, 0.5);
        }
        .retry-btn:active {
            transform: translateY(0);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="offline-card">
        <div class="icon-wrapper">
            <span class="material-symbols-rounded">wifi_off</span>
        </div>
        <h1>No Internet Connection</h1>
        <p>DoneSpace needs an active connection to sync your chores, meals, and household leaderboard. Check your network and try again.</p>
        <button class="retry-btn" onclick="window.location.reload()">
            <span class="material-symbols-rounded">refresh</span>
            <span>Retry Connection</span>
        </button>
    </div>
</body>
</html>
